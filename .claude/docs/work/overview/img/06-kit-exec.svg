<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="372" viewBox="-16 -16 1072 372" role="img" aria-label="Файл-канал: код задачи собирается в kit-exec.php с проверкой php -l, кладётся в корень проекта, доезжает на сервер и открывается во встроенном браузере Claude. На сервере файл загружает ядро Битрикса, пускает только администратора, печатает свой номер запуска и выполняет код, только если номер в адресе совпал. В конце работы файл удаляет сам себя."><title>Файл-канал: код задачи собирается в kit-exec.php с проверкой php -l, кладётся в корень проекта, доезжает на сервер и открывается во встроенном браузере Claude. На сервере файл загружает ядро Битрикса, пускает только администратора, печатает свой номер запуска и выполняет код, только если номер в адресе совпал. В конце работы файл удаляет сам себя.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d6-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d6-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="371" rx="10"/><text class="cap" x="20" y="18" text-anchor="start">путь файла</text><g class="n "><rect class="box" x="20" y="30" width="160" height="60" rx="8"/><text class="tm" x="100" y="56.6" text-anchor="middle">task.php</text><text class="s" x="100" y="72.1" text-anchor="middle">код задачи</text></g><g class="n "><rect class="box" x="210" y="30" width="170" height="60" rx="8"/><text class="tm" x="295" y="56.6" text-anchor="middle">kit-exec.js</text><text class="s" x="295" y="72.1" text-anchor="middle">php -l · номер run</text></g><g class="n "><rect class="box" x="410" y="30" width="170" height="60" rx="8"/><text class="tm" x="495" y="56.6" text-anchor="middle">kit-exec.php</text><text class="s" x="495" y="72.1" text-anchor="middle">в корень проекта</text></g><g class="n "><rect class="box" x="610" y="30" width="190" height="60" rx="8"/><text class="t" x="705" y="49.1" text-anchor="middle">Доставка</text><text class="s" x="705" y="64.6" text-anchor="middle">Always — сама, иначе</text><text class="s" x="705" y="79.6" text-anchor="middle">заливает пользователь</text></g><g class="n k-core"><rect class="box" x="830" y="30" width="190" height="60" rx="8"/><text class="t" x="925" y="56.6" text-anchor="middle">Браузер Claude</text><text class="m" x="925" y="72.1" text-anchor="middle">/kit-exec.php?run=…</text></g><path class="e " d="M180 60 L210 60" marker-end="url(#d6-a)"/><path class="e " d="M380 60 L410 60" marker-end="url(#d6-a)"/><path class="e " d="M580 60 L610 60" marker-end="url(#d6-a)"/><path class="e " d="M800 60 L830 60" marker-end="url(#d6-a)"/><path class="e " d="M925 90 L925 120 L105 120 L105 160" marker-end="url(#d6-a)"/><text class="lbl u" x="515" y="114" text-anchor="middle">открыть страницу = выполнить код</text><text class="cap" x="20" y="146" text-anchor="start">на сервере</text><g class="n "><rect class="box" x="20" y="160" width="170" height="54" rx="8"/><text class="t" x="105" y="183.6" text-anchor="middle">Ядро Битрикса</text><text class="s" x="105" y="199.1" text-anchor="middle">права — настоящие</text></g><g class="n "><polygon class="box" points="300,155 375,187 300,219 225,187"/><text class="t" x="300" y="191.1" text-anchor="middle">IsAdmin()?</text></g><g class="n "><rect class="box" x="415" y="160" width="200" height="54" rx="8"/><text class="m" x="515" y="183.1" text-anchor="middle">echo KIT-RUN номер</text><text class="s" x="515" y="198.1" text-anchor="middle">номер этого файла</text></g><g class="n "><polygon class="box" points="715,155 790,187 715,219 640,187"/><text class="t" x="715" y="191.1" text-anchor="middle">?run совпал?</text></g><g class="n k-core"><rect class="box" x="850" y="160" width="170" height="54" rx="8"/><text class="m" x="935" y="183.1" text-anchor="middle">try { код задачи }</text><text class="s" x="935" y="198.1" text-anchor="middle">вывод — результат</text></g><path class="e " d="M190 187 L225 187" marker-end="url(#d6-a)"/><path class="e " d="M375 187 L415 187" marker-end="url(#d6-a)"/><text class="lbl " x="395" y="179" text-anchor="middle">да</text><path class="e " d="M615 187 L640 187" marker-end="url(#d6-a)"/><path class="e " d="M790 187 L850 187" marker-end="url(#d6-a)"/><text class="lbl " x="820" y="179" text-anchor="middle">да</text><path class="e u" d="M300 219 L300 262" marker-end="url(#d6-u)"/><text class="lbl u" x="308" y="245" text-anchor="start">нет</text><g class="n k-user"><rect class="box" x="205" y="262" width="190" height="60" rx="8"/><text class="t" x="300" y="281.1" text-anchor="middle">403</text><text class="s" x="300" y="296.6" text-anchor="middle">входит пользователь</text><text class="s" x="300" y="311.6" text-anchor="middle">в /bitrix/admin/</text></g><path class="e " d="M715 219 L715 262" marker-end="url(#d6-a)"/><text class="lbl " x="723" y="245" text-anchor="start">нет</text><g class="n "><rect class="box" x="620" y="262" width="190" height="60" rx="8"/><text class="t" x="715" y="288.6" text-anchor="middle">код не выполнялся</text><text class="s" x="715" y="304.1" text-anchor="middle">открыть снова можно</text></g><path class="e d" d="M935 214 L935 262" marker-end="url(#d6-a)"/><text class="lbl " x="927" y="245" text-anchor="end">в конце работы</text><g class="n k-user"><rect class="box" x="850" y="262" width="170" height="60" rx="8"/><text class="m" x="935" y="288.1" text-anchor="middle">unlink(__FILE__