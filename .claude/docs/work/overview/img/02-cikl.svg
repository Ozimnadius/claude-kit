<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="452" viewBox="-16 -16 1072 452" role="img" aria-label="Цикл работы: после /kit:project-init идёт петля шаг — проверка — /kit:step-done — следующий шаг; хук php -l срабатывает при записи кода; /kit:visual снимает до и после, /kit:server проверяет на сервере, /kit:deploy-list готовит выкладку, а выкладка возвращается в журнал блоком DEPLOY."><title>Цикл работы: после /kit:project-init идёт петля шаг — проверка — /kit:step-done — следующий шаг; хук php -l срабатывает при записи кода; /kit:visual снимает до и после, /kit:server проверяет на сервере, /kit:deploy-list готовит выкладку, а выкладка возвращается в журнал блоком DEPLOY.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d2-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d2-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="451" rx="10"/><g class="n k-skill"><rect class="box" x="20" y="150" width="170" height="60" rx="8"/><text class="tm" x="105" y="176.6" text-anchor="middle">/kit:project-init</text><text class="s" x="105" y="192.1" text-anchor="middle">один раз</text></g><g class="n k-core"><rect class="box" x="260" y="60" width="190" height="64" rx="8"/><text class="t" x="355" y="88.6" text-anchor="middle">Шаг: код</text><text class="s" x="355" y="104.1" text-anchor="middle">черновик → проект</text></g><g class="n "><rect class="box" x="540" y="60" width="190" height="64" rx="8"/><text class="t" x="635" y="88.6" text-anchor="middle">Проверка</text><text class="s" x="635" y="104.1" text-anchor="middle">сервер, браузер, php -l</text></g><g class="n k-skill"><rect class="box" x="540" y="236" width="190" height="64" rx="8"/><text class="tm" x="635" y="264.6" text-anchor="middle">/kit:step-done</text><text class="s" x="635" y="280.1" text-anchor="middle">журнал, коммит, push</text></g><g class="n "><rect class="box" x="260" y="236" width="190" height="64" rx="8"/><text class="t" x="355" y="264.6" text-anchor="middle">Следующий шаг</text><text class="s" x="355" y="280.1" text-anchor="middle">из «Сейчас» журнала</text></g><g class="n k-hook"><rect class="box" x="415" y="6" width="160" height="30" rx="8"/><text class="m" x="495" y="24.6" text-anchor="middle">PostToolUse: php -l</text></g><path class="e d" d="M495 36 L495 86" marker-end="url(#d2-a)"/><text class="loop" x="495" y="176" text-anchor="middle">один шаг —</text><text class="loop" x="495" y="194" text-anchor="middle">один коммит</text><path class="e " d="M450 92 L540 92" marker-end="url(#d2-a)"/><path class="e " d="M635 124 L635 236" marker-end="url(#d2-a)"/><text class="lbl " x="645" y="184" text-anchor="start">проверено</text><path class="e " d="M540 268 L450 268" marker-end="url(#d2-a)"/><text class="lbl " x="495" y="260" text-anchor="middle">коммит</text><path class="e " d="M355 236 L355 124" marker-end="url(#d2-a)"/><text class="lbl " x="347" y="184" text-anchor="end">дальше</text><path class="e " d="M190 180 L222 180 L222 92 L260 92" marker-end="url(#d2-a)"/><g class="n k-skill"><rect class="box" x="830" y="40" width="190" height="64" rx="8"/><text class="tm" x="925" y="61.1" text-anchor="middle">/kit:visual</text><text class="s" x="925" y="76.6" text-anchor="middle">before — до шага</text><text class="s" x="925" y="91.6" text-anchor="middle">after + compare</text></g><g class="n k-skill"><rect class="box" x="830" y="150" width="190" height="64" rx="8"/><text class="tm" x="925" y="178.6" text-anchor="middle">/kit:server</text><text class="s" x="925" y="194.1" text-anchor="middle">md5, логи, удаления</text></g><g class="n k-skill"><rect class="box" x="830" y="260" width="190" height="64" rx="8"/><text class="tm" x="925" y="288.6" text-anchor="middle">/kit:deploy-list</text><text class="s" x="925" y="304.1" text-anchor="middle">что залить и удалить</text></g><g class="n k-user"><rect class="box" x="830" y="350" width="190" height="56" rx="8"/><text class="t" x="925" y="374.6" text-anchor="middle">Выкладка</text><text class="s" x="925" y="390.1" text-anchor="middle">PhpStorm или вручную</text></g><path class="e " d="M730 80 L830 80" marker-end="url(#d2-a)"/><text class="lbl " x="780" y="72" text-anchor="middle">снимки</text><path class="e d" d="M730 108 L780 108 L780 182 L830 182" marker-end="url(#d2-a)"/><text class="lbl " x="774" y="150" text-anchor="end">на сервере</text><path class="e " d="M730 284 L830 284" marker-end="url(#d2-a)"/><text class="lbl " x="780" y="276" text-anchor="middle">к выкладке</text><path class="e " d="M925 324 L925 350" marker-end="url(#d2-a)"/><path class="e " d="M925 260 L925 214" marker-end="url(#d2-a)"/><text class="lbl " x="933" y="241" text-anchor="start">удаления</text><path class="e " d="M830 378 L635 378 L635 300" marker-end="url(#d2-a)"/><text class="lbl " x="732" y="370" text-anchor="middle">DEPLOY в журнал</text></svg>
