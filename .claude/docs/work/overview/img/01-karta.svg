<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="584" viewBox="-16 -16 1072 584" role="img" aria-label="Карта плагина kit: пользователь даёт команды Claude, хуки перехватывают события сессии, Claude вызывает команды /kit: (на схеме — пять основных), каждая команда работает через свои скрипты и агентов и меняет git, журнал, сервер или сайт."><title>Карта плагина kit: пользователь даёт команды Claude, хуки перехватывают события сессии, Claude вызывает команды /kit: (на схеме — пять основных), каждая команда работает через свои скрипты и агентов и меняет git, журнал, сервер или сайт.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d1-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d1-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="583" rx="10"/><g class="n k-user"><rect class="box" x="389" y="14" width="260" height="52" rx="8"/><text class="t" x="519" y="36.6" text-anchor="middle">Пользователь</text><text class="s" x="519" y="52.1" text-anchor="middle">команды · ответы «да/нет» · пароли</text></g><g class="n k-hook"><rect class="box" x="20" y="100" width="280" height="88" rx="8"/><text class="t" x="32" y="125.6" text-anchor="start">Хуки — срабатывают сами</text><text class="m" x="32" y="141.1" text-anchor="start">SessionStart → контекст</text><text class="m" x="32" y="156.1" text-anchor="start">PreToolUse → запрет</text><text class="m" x="32" y="171.1" text-anchor="start">PostToolUse → php -l</text></g><g class="n k-core"><rect class="box" x="389" y="100" width="260" height="88" rx="8"/><text class="t" x="519" y="133.1" text-anchor="middle">Claude</text><text class="s" x="519" y="148.6" text-anchor="middle">основной агент сессии</text><text class="s" x="519" y="163.6" text-anchor="middle">выполняет скиллы, зовёт агентов</text></g><g class="n "><rect class="box" x="740" y="100" width="280" height="88" rx="8"/><text class="t" x="752" y="125.6" text-anchor="start">Проект</text><text class="m" x="752" y="141.1" text-anchor="start">.claude/CLAUDE.md → Параметры</text><text class="m" x="752" y="156.1" text-anchor="start">.claude/docs/progress.md</text><text class="m" x="752" y="171.1" text-anchor="start">.claude/docs/deploy-prod.md</text></g><path class="e " d="M519 66 L519 100" marker-end="url(#d1-a)"/><text class="lbl " x="527" y="88" text-anchor="start">команды, ответы</text><path class="e " d="M300 144 L389 144" marker-end="url(#d1-a)"/><text class="lbl " x="344" y="136" text-anchor="middle">перехват</text><path class="e " d="M740 144 L649 144" marker-end="url(#d1-a)"/><text class="lbl " x="694" y="136" text-anchor="middle">читает</text><path class="e " d="M519 188 L519 212"/><path class="e " d="M115 212 L923 212"/><text class="lbl " x="216" y="205" text-anchor="middle">Skill: сам или по команде</text><path class="e " d="M115 212 L115 236" marker-end="url(#d1-a)"/><g class="n k-skill"><rect class="box" x="20" y="236" width="190" height="56" rx="8"/><text class="tm" x="115" y="260.6" text-anchor="middle">/kit:project-init</text><text class="s" x="115" y="276.1" text-anchor="middle">один раз на проект</text></g><path class="e " d="M115 292 L115 316" marker-end="url(#d1-a)"/><g class="n "><rect class="box" x="20" y="316" width="190" height="136" rx="8"/><text class="m" x="32" y="337.1" text-anchor="start">site-probe.js</text><text class="m" x="32" y="352.1" text-anchor="star