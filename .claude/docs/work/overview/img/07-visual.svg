<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="318" viewBox="-16 -16 1072 318" role="img" aria-label="Снимки /kit:visual: один раз — зависимости, список страниц и вход администратора; на каждое изменение — эталон before, контрольный прогон для замера шума, шаг, снимки after, сравнение и отчёт. Перед записью снимков проверяется, что PhpStorm не зальёт их на сервер."><title>Снимки /kit:visual: один раз — зависимости, список страниц и вход администратора; на каждое изменение — эталон before, контрольный прогон для замера шума, шаг, снимки after, сравнение и отчёт. Перед записью снимков проверяется, что PhpStorm не зальёт их на сервер.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d7-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d7-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="317" rx="10"/><text class="cap" x="20" y="22" text-anchor="start">один раз на проект и машину</text><g class="n "><rect class="box" x="20" y="34" width="200" height="58" rx="8"/><text class="tm" x="120" y="59.6" text-anchor="middle">deps</text><text class="s" x="120" y="75.1" text-anchor="middle">нет → install с согласия</text></g><g class="n "><rect class="box" x="250" y="34" width="210" height="58" rx="8"/><text class="tm" x="355" y="59.6" text-anchor="middle">pages.json</text><text class="s" x="355" y="75.1" text-anchor="middle">discover → список → «Да»</text></g><g class="n k-user"><rect class="box" x="490" y="34" width="220" height="58" rx="8"/><text class="tm" x="600" y="59.6" text-anchor="middle">login</text><text class="s" x="600" y="75.1" text-anchor="middle">Chrome, входит пользователь</text></g><g class="n k-ext"><rect class="box" x="740" y="34" width="280" height="58" rx="8"/><text class="s" x="880" y="59.1" text-anchor="middle">зависимости и сессии входа —</text><text class="m" x="880" y="74.1" text-anchor="middle">%LOCALAPPDATA%\kit\visual</text></g><path class="e " d="M220 63 L250 63" marker-end="url(#d7-a)"/><path class="e " d="M460 63 L490 63" marker-end="url(#d7-a)"/><text class="cap" x="20" y="130" text-anchor="start">каждое изменение</text><g class="n "><rect class="box" x="20" y="142" width="150" height="58" rx="8"/><text class="tm" x="95" y="167.6" text-anchor="middle">shoot before</text><text class="s" x="95" y="183.1" text-anchor="middle">эталон</text></g><g class="n "><rect class="box" x="195" y="142" width="165" height="58" rx="8"/><text class="tm" x="277.5" y="167.6" text-anchor="middle">check before</text><text class="s" x="277.5" y="183.1" text-anchor="middle">шум → noise.json</text></g><path class="e " d="M170 171 L195 171" marker-end="url(#d7-a)"/><g class="n k-core"><rect class="box" x="385" y="142" width="150" height="58" rx="8"/><text class="t" x="460" y="167.6" text-anchor="middle">Шаг</text><text class="s" x="460" y="183.1" text-anchor="middle">код, обновление</text></g><path class="e " d="M360 171 L385 171" marker-end="url(#d7-a)"/><g class="n "><rect class="box" x="560" y="142" width="150" height="58" rx="8"/><text class="tm" x="635" y="167.6" text-anchor="middle">shoot after-ID</text><text class="s" x="635" y="183.1" text-anchor="middle">весь или --only</text></g><path class="e " d="M535 171 L560 171" marker-end="url(#d7-a)"/><g class="n "><rect class="box" x="735" y="142" width="150" height="58" rx="8"/><text class="tm" x="810" y="167.6" text-anchor="middle">compare</text><text class="s" x="810" y="183.1" text-anchor="middle">до ↔ после</text></g><path class="e " d="M710 171 L735 171" marker-end="url(#d7-a)"/><g class="n "><rect class="box" x="910" y="142" width="110" height="58" rx="8"/><text class="tm" x="965" y="167.6" text-anchor="middle">report.html</text><text class="s" x="965" y="183.1" text-anchor="middle">отчёт</text></g><path class="e " d="M885 171 L910 171" marker-end="url(#d7-a)"/><g class="n k-user"><rect class="box" x="20" y="228" width="1000" height="44" rx="8"/><text class="s" x="520" y="253.6" text-anchor="middle">Перед записью в папку снимков: PhpStorm Always, а папка не исключена → код 4, ничего не снимается</text></g></svg>
