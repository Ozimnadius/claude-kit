<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="502" viewBox="-16 -16 1072 502" role="img" aria-label="Выбор канала /kit:server: если для сервера задан параметр SSH — канал SSH с кодами 0, 1, 3; при коде 3 отказ во входе ведёт на файл-канал, смена отпечатка — стоп, обрыв изменяющего кода — результат неизвестен. Без SSH: в режиме bitrix с адресом сайта — файл-канал kit-exec.php, иначе выполнить негде."><title>Выбор канала /kit:server: если для сервера задан параметр SSH — канал SSH с кодами 0, 1, 3; при коде 3 отказ во входе ведёт на файл-канал, смена отпечатка — стоп, обрыв изменяющего кода — результат неизвестен. Без SSH: в режиме bitrix с адресом сайта — файл-канал kit-exec.php, иначе выполнить негде.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d5-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d5-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="501" rx="10"/><g class="n k-core"><rect class="box" x="400" y="14" width="240" height="52" rx="8"/><text class="t" x="520" y="36.6" text-anchor="middle">Задача на сервере</text><text class="s" x="520" y="52.1" text-anchor="middle">сервер — прод; оба → вопрос</text></g><path class="e " d="M520 66 L520 95" marker-end="url(#d5-a)"/><g class="n "><polygon class="box" points="520,95 640,130 520,165 400,130"/><text class="t" x="520" y="134.1" text-anchor="middle">«SSH …» задан?</text></g><path class="e " d="M400 130 L205 130 L205 196" marker-end="url(#d5-a)"/><text class="lbl " x="300" y="122" text-anchor="middle">да</text><path class="e " d="M640 130 L740 130 L740 205" marker-end="url(#d5-a)"/><text class="lbl " x="690" y="122" text-anchor="middle">нет</text><g class="n "><rect class="box" x="40" y="196" width="330" height="88" rx="8"/><text class="t" x="52" y="221.6" text-anchor="start">Канал SSH</text><text class="m" x="52" y="237.1" text-anchor="start">ssh -o BatchMode=yes … 'команда'</text><text class="m" x="52" y="252.1" text-anchor="start">remote-php.js файл.php</text><text class="s" x="52" y="267.1" text-anchor="start">bitrix → код идёт с ядром Битрикса</text></g><g class="n "><polygon class="box" points="740,205 840,240 740,275 640,240"/><text class="t" x="740" y="244.1" text-anchor="middle">bitrix и адрес?</text></g><path class="e " d="M740 275 L740 330" marker-end="url(#d5-a)"/><text class="lbl " x="748" y="306" text-anchor="start">да</text><path class="e u" d="M840 240 L880 240" marker-end="url(#d5-u)"/><text class="lbl u" x="860" y="232" text-anchor="middle">нет</text><g class="n k-user"><rect class="box" x="880" y="212" width="145" height="56" rx="8"/><text class="t" x="952.5" y="236.6" text-anchor="middle">Негде</text><text class="s" x="952.5" y="252.1" text-anchor="middle">включить SSH</text></g><g class="n k-core"><rect class="box" x="610" y="330" width="260" height="70" rx="8"/><text class="t" x="740" y="361.6" text-anchor="middle">Файл-канал kit-exec.php</text><text class="s" x="740" y="377.1" text-anchor="middle">браузер Claude, только админ</text></g><text class="s" x="740" y="422" text-anchor="middle">как он устроен — схема ниже</text><path class="e " d="M205 284 L205 300"/><path class="e " d="M90 300 L315 300"/><path class="e " d="M90 300 L90 318" marker-end="url(#d5-a)"/><path class="e " d="M200 300 L200 318" marker-end="url(#d5-a)"/><path class="e " d="M315 300 L315 318" marker-end="url(#d5-a)"/><g class="n "><rect class="box" x="40" y="318" width="100" height="42" rx="8"/><text class="t" x="90" y="335.6" text-anchor="middle">0</text><text class="s" x="90" y="351.1" text-anchor="middle">результат</text></g><g class="n "><rect class="box" x="150" y="318" width="100" height="42" rx="8"/><text class="t" x="200" y="335.6" text-anchor="middle">1</text><text class="s" x="200" y="351.1" text-anchor="middle">ошибка PHP</text></g><g class="n "><rect class="box" x="260" y="318" width="110" height="42" rx="8"/><text class="t" x="315" y="335.6" text-anchor="middle">3</text><text class="s" x="315" y="351.1" text-anchor="middle">нет связи</text></g><path class="e d" d="M370 339 L610 339" marker-end="url(#d5-a)"/><text class="lbl " x="490" y="331" text-anchor="middle">отказ во входе</text><path class="e " d="M315 360 L315 382"/><path class="e " d="M115 382 L435 382"/><path class="e " d="M115 382 L115 400" marker-end="url(#d5-a)"/><path class="e " d="M275 382 L275 400" marker-end="url(#d5-a)"/><path class="e " d="M435 382 L435 400" marker-end="url(#d5-a)"/><g class="n k-user"><rect class="box" x="40" y="400" width="150" height="56" rx="8"/><text class="s" x="115" y="424.1" text-anchor="middle">новый сервер:</text><text class="s" x="115" y="439.1" text-anchor="middle">входит пользователь</text></g><g class="n k-user"><rect class="box" x="200" y="400" width="150" height="56" rx="8"/><text class="t" x="275" y="424.6" text-anchor="middle">стоп</text><text class="s" x="275" y="440.1" text-anchor="middle">отпечаток сменился</text></g><g class="n "><rect class="box" x="360" y="400" width="150" height="56" rx="8"/><text class="s" x="435" y="424.1" text-anchor="middle">обрыв изменения:</text><text class="s" x="435" y="439.1" text-anchor="middle">результат неизвестен</text></g></svg>
