<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="692" viewBox="-16 -16 1072 692" role="img" aria-label="Хуки: каждое событие сначала проверяет, kit-проект ли это; если нет — тишина. SessionStart дописывает исключения PhpStorm, кладёт в контекст раздел «Сейчас» и правила и сверяет ветку с удалённым репозиторием; PreToolUse запрещает cd вне подоболочки и sed -i по PHP, а в проекте Мэтта (с 3.3.0) ещё коммит в обход /kit:step-done, ветки и worktree при автозаливке (guard-bash.js), файлы Мэтта в корне проекта и worktree у субагента и подчинённой сессии (guard-matt.js); PostToolUse после правки прогоняет php -l и при ошибке возвращает код 2, а после вопроса пользователю записывает ответ во входящие для /kit:step-done."><title>Хуки: каждое событие сначала проверяет, kit-проект ли это; если нет — тишина. SessionStart дописывает исключения PhpStorm, кладёт в контекст раздел «Сейчас» и правила и сверяет ветку с удалённым репозиторием; PreToolUse запрещает cd вне подоболочки и sed -i по PHP, а в проекте Мэтта (с 3.3.0) ещё коммит в обход /kit:step-done, ветки и worktree при автозаливке (guard-bash.js), файлы Мэтта в корне проекта и worktree у субагента и подчинённой сессии (guard-matt.js); PostToolUse после правки прогоняет php -l и при ошибке возвращает код 2, а после вопроса пользователю записывает ответ во входящие для /kit:step-done.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d3-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d3-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="691" rx="10"/><g class="n k-hook"><rect class="box" x="20" y="22" width="200" height="140" rx="8"/><text class="tm" x="120" y="81.1" text-anchor="middle">SessionStart</text><text class="m" x="120" y="96.6" text-anchor="middle">startup · resume</text><text class="m" x="120" y="111.6" text-anchor="middle">clear · compact</text></g><g class="n k-hook"><rect class="box" x="20" y="200" width="200" height="70" rx="8"/><text class="tm" x="120" y="231.6" text-anchor="middle">PreToolUse</text><text class="m" x="120" y="247.1" text-anchor="middle">Bash · PowerShell</text></g><g class="n k-hook"><rect class="box" x="20" y="312" width="200" height="82" rx="8"/><text class="tm" x="120" y="342.1" text-anchor="middle">PreToolUse</text><text class="m" x="120" y="357.6" text-anchor="middle">Write · Edit · Agent</text><text class="m" x="120" y="372.6" text-anchor="middle">start_session</text></g><g class="n k-hook"><rect class="box" x="20" y="424" width="200" height="70" rx="8"/><text class="tm" x="120" y="455.6" text-anchor="middle">PostToolUse</text><text class="m" x="120" y="471.1" text-anchor="middle">Write · Edit · MultiEdit</text></g><g class="n k-hook"><rect class="box" x="20" y="524" width="200" height="70" rx="8"/><text class="tm" x="120" y="555.6" text-anchor="middle">PostToolUse</text><text class="m" x="120" y="571.1" text-anchor="middle">AskUserQuestion</text></g><g class="n k-core"><rect class="box" x="262" y="22" width="130" height="572" rx="8"/><text class="t" x="327" y="297.1" text-anchor="middle">kit-проект?</text><text class="s" x="327" y="312.6" text-anchor="middle">«Параметры»</text><text class="s" x="327" y="327.6" text-anchor="middle">или журнал</text></g><path class="e u" d="M327 594 L327 622" marker-end="url(#d3-u)"/><text class="lbl u" x="327" y="642" text-anchor="middle">нет → тишина, код