 " d="M392 142 L432 142" marker-end="url(#d3-a)"/><path class="e " d="M392 235 L432 235" marker-end="url(#d3-a)"/><text class="lbl " x="412" y="227" text-anchor="middle">да</text><path class="e " d="M392 347 L432 347" marker-end="url(#d3-a)"/><g class="n k-ext"><rect class="box" x="662" y="22" width="358" height="40" rx="8"/><text class="s" x="841" y="45.6" text-anchor="middle">Excluded Paths в .idea/deployment.xml</text></g><g class="n "><rect class="box" x="662" y="72" width="358" height="40" rx="8"/><text class="s" x="841" y="95.6" text-anchor="middle">в контекст Claude: «Сейчас» + правила</text></g><g class="n k-ext"><rect class="box" x="662" y="122" width="358" height="40" rx="8"/><text class="s" x="841" y="145.6" text-anchor="middle">git fetch → pull --ff-only, push или стоп</text></g><g class="n "><rect class="box" x="662" y="202" width="180" height="66" rx="8"/><text class="m" x="752" y="223.6" text-anchor="middle">cd вне ( … )</text><text class="m" x="752" y="238.6" text-anchor="middle">Set-Location</text><text class="m" x="752" y="253.6" text-anchor="middle">sed -i по .php</text></g><g class="n k-user"><rect class="box" x="870" y="210" width="150" height="50" rx="8"/><text class="t" x="945" y="231.6" text-anchor="middle">deny</text><text class="s" x="945" y="247.1" text-anchor="middle">+ причина</text></g><g class="n "><rect class="box" x="662" y="314" width="180" height="66" rx="8"/><text class="s" x="752" y="335.6" text-anchor="middle">.php и параметр</text><text class="s" x="752" y="350.6" text-anchor="middle">«PHP» — путь</text><text class="s" x="752" y="365.6" text-anchor="middle">к php.exe</text></g><g class="n k-user"><rect class="box" x="870" y="322" width="150" height="50" rx="8"/><text class="t" x="945" y="343.6" text-anchor="middle">код 2</text><text class="s" x="945" y="359.1" text-anchor="middle">ошибка → Claude</text></g><path class="e " d="M622 42 L662 42" marker-end="url(#d3-a)"/><path class="e " d="M622 92 L662 92" marker-end="url(#d3-a)"/