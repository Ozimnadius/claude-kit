<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="864" viewBox="-16 -16 1072 864" role="img" aria-label="Последовательность /kit:step-done: Claude собирает файлы шага и входящие ответы, при закрытии этапа сверяет задуманное со сделанным, docs-keeper обновляет журнал, его части и чек-лист плана, Claude сверяет отчёт с файлами и переносит закрытый этап в journal/stages/, скрипт kit-commit.js получает пути и сообщение (heredoc из Bash), проверяет пути, добавляет файлы, проверяет секреты, делает один коммит и сверяет его сообщение с поданным побайтно, после чего Claude проверяет число коммитов, убирает разобранные входящие и, если задан удалённый репозиторий, отправляет коммит."><title>Последовательность /kit:step-done: Claude собирает файлы шага и входящие ответы, при закрытии этапа сверяет задуманное со сделанным, docs-keeper обновляет журнал, его части и чек-лист плана, Claude сверяет отчёт с файлами и переносит закрытый этап в journal/stages/, скрипт kit-commit.js получает пути и сообщение (heredoc из Bash), проверяет пути, добавляет файлы, проверяет секреты, делает один коммит и сверяет его сообщение с поданным побайтно, после чего Claude проверяет число коммитов, убирает разобранные входящие и, если задан удалённый репозиторий, отправляет коммит.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d4-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="863" rx="10"/><g class="n k-core"><rect class="box" x="25" y="12" width="170" height="48" rx="8"/><text class="t" x="110" y="32.6" text-anchor="middle">Claude</text><text class="s" x="110" y="48.1" text-anchor="middle">основной агент</text></g><g class="n k-agent"><rect class="box" x="245" y="12" width="170" height="48" rx="8"/><text class="tm" x="330" y="32.6" text-anchor="middle">kit:docs-keeper</text><text class="s" x="330" y="48.1" text-anchor="middle">модель sonnet</text></g><g class="n "><rect class="box" x="465" y="12" width="170" height="48" rx="8"/><text class="tm" x="550" y="32.6" text-anchor="middle">kit-commit.js</text><text class="s" x="550" y="48.1" text-anchor="middle">скрипт, без модели</text></g><g class="n "><rect class="box" x="685" y="12" width="170" height="48" rx="8"/><text class="tm" x="770" y="32.6" text-anchor="middle">secret-scan.js</text><text class="s" x="770" y="48.1" text-anchor="middle">пути и секреты</text></g><g class="n k-ext"><rect class="box" x="880" y="12" width="140" height="48" rx="8"/><text class="tm" x="950" y="32.6" text-anchor="middle">git</text><text class="s" x="950" y="48.1" text-anchor="middle">репозиторий</text></g><line class="life" x1="110" y1="60" x2="110" y2="824"/><line class="life" x1="330" y1="60" x2="330" y2="824"/><line class="life" x1="550" y1="60" x2="550" y2="824"/><line class="life" x1="770" y1="60" x2="770" y2="824"/><line class="life" x1="950" y1="60" x2="950" y2="824"/><path class="e " d="M110 92 L947 92" marker-end="url(#d4-a)"/><text class="lbl " x="530" y="85" text-anchor="middle">rev-parse HEAD · status --porcelain</text><g class="n k-note"><rect class="box" x="15" y="104" width="190" height="40" rx="4"/><text class="s" x="110" y="120.1" text-anchor="middle">пути — файлы шага</text><text class="s" x="110" y="135.1" text-anchor="middle">чужие правки → вопрос</text></g><g class="n k-note"><rect class="box" x="15" y="152" width="190" height="40" rx="4"/><text class="s" x="110" y="168.1" text-anchor="middle">входящие ответы → DECISIONS</text><text class="s" x="110" y="183.1" text-anchor="middle">decision-inbox.js --list</text></g><g class="n k-user"><rect class="box" x="15" y="200" width="190" height="40" rx="4"/><text class="s" x="110" y="216.1" text-anchor="middle">конец этапа? сверка</text><text class="s" x="110" y="231.1" text-anchor="middle">work/ → archive/ с выбора</text></g><path class="e " d="M110 268 L327 268" marker-end="url(#d4-a)"/><text class="lbl " x="220" y="261" text-anchor="middle">STEP · STATUS · SUMMARY · CHECK · NEXT …</text><g class="n k-note"><rect class="box" x="242" y="280" width="176" height="40" rx="4"/><text class="s" x="330" y="296.1" text-anchor="middle">журнал и части journal/,</text><text class="s" x="330" y="311.1" text-anchor="middle">[x] в плане этапа</text></g><path class="e d" d="M330 344 L113 344" marker-end="url(#d4-a)"/><text class="lbl " x="220" y="337" text-anchor="middle">отчёт: «Сейчас», цитаты, файлы</text><g class="n k-note"><rect class="box" x="15" y="358" width="190" height="40" rx="4"/><text class="s" x="110" y="374.1" text-anchor="middle">сверка отчёта Grep-ом</text><text class="s" x="110" y="389.1" text-anchor="middle">нет строки → повтор</text></g><g class="n k-user"><rect class="box" x="15" y="406" width="190" height="40" rx="4"/><text class="s" x="110" y="422.1" text-anchor="middle">journal-split.js --stage N</text><text class="s" x="110" y="437.1" text-anchor="middle">этап → journal/stages/</text></g><path class="e " d="M110 474 L547 474" marker-end="url(#d4-a)"/><text class="lbl " x="330" y="467" text-anchor="middle">-- &lt;пути&gt; &lt;&lt;'KIT_MSG' (Bash)</text><path class="e " d="M550 506 L767 506" marker-end="url(#d4-a)"/><text class="lbl " x="660" y="499" text-anchor="middle">--paths &lt;пути&gt;</text><path class="e d u" d="M770 528 L553 528" marker-end="url(#d4-u)"/><text class="lbl u" x="660" y="542" text-anchor="middle">1 → стоп</text><path class="e " d="M550 564 L947 564" marker-end="url(#d4-a)"/><text class="lbl " x="750" y="557" text-anchor="middle">add -A -- &lt;пути&gt;</text><path class="e " d="M550 596 L767 596" marker-end="url(#d4-a)"/><text class="lbl " x="660" y="589" text-anchor="middle">--cached &lt;пути&gt;</text><path class="e d u" d="M770 618 L553 618" marker-end="url(#d4-u)"/><text class="lbl u" x="660" y="632" text-anchor="middle">1 → стоп, индекс как есть</text><path class="e " d="M550 654 L947 654" marker-end="url(#d4-a)"/><text class="lbl " x="750" y="647" text-anchor="middle">commit -F - -- &lt;пути&gt;</text><path class="e d" d="M550 686 L113 686" marker-end="url(#d4-a)"/><text class="lbl " x="330" y="679" text-anchor="middle">код 0 · хеш · «сообщение совпало»</text><path class="e " d="M110 716 L947 716" marker-end="url(#d4-a)"/><text class="lbl " x="530" y="709" text-anchor="middle">проверка: 1 коммит, статус чистый</text><g class="n k-note"><rect class="box" x="15" y="728" width="190" height="40" rx="4"/><text class="s" x="110" y="744.1" text-anchor="middle">прошла → входящие</text><text class="s" x="110" y="759.1" text-anchor="middle">decision-inbox.js --clear N</text></g><path class="e " d="M110 788 L767 788" marker-end="url(#d4-a)"/><text class="lbl " x="440" y="781" text-anchor="middle">--history — только перед первой отправкой</text><path class="e " d="M110 816 L947 816" marker-end="url(#d4-a)"/><text class="lbl " x="530" y="809" text-anchor="middle">push -u &lt;имя&gt; HEAD — если задан «Удалённый репозиторий»</text></svg>
