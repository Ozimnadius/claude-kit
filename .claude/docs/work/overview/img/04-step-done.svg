<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="932" viewBox="-16 -16 1072 932" role="img" aria-label="Последовательность /kit:step-done с 3.0.0: Claude запускает kit-step.js — тот отдаёт файлы шага, входящие ответы готовыми строками решений и режим; при закрытии этапа Claude сверяет задуманное со сделанным; блоки шага уходят в kit-journal.js, который пишет журнал, его части и чек-лист плана по принципу «всё или ничего» и возвращает «Сейчас» и изменённые файлы; Claude показывает незакоммиченные изменения в панели приложения Claude и ждёт «Коммитить», а при закрытии этапа после этого переносит его в journal/stages/; kit-commit.js проверяет пути, добавляет файлы, проверяет секреты, делает один коммит, сверяет его, убирает разобранные входящие и, если задан удалённый репозиторий, отправляет коммит — в первый раз после проверки всей истории."><title>Последовательность /kit:step-done с 3.0.0: Claude запускает kit-step.js — тот отдаёт файлы шага, входящие ответы готовыми строками решений и режим; при закрытии этапа Claude сверяет задуманное со сделанным; блоки шага уходят в kit-journal.js, который пишет журнал, его части и чек-лист плана по принципу «всё или ничего» и возвращает «Сейчас» и изменённые файлы; Claude показывает незакоммиченные изменения в панели приложения Claude и ждёт «Коммитить», а при закрытии этапа после этого переносит его в journal/stages/; kit-commit.js проверяет пути, добавляет файлы, проверяет секреты, делает один коммит, сверяет его, убирает разобранные входящие и, если задан удалённый репозиторий, отправляет коммит — в первый раз после проверки всей истории.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d4-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="931" rx="10"/><g class="n k-core"><rect class="box" x="30" y="12" width="150" height="48" rx="8"/><text class="t" x="105" y="32.6" text-anchor="middle">Claude</text><text class="s" x="105" y="48.1" text-anchor="middle">основной агент</text></g><g class="n "><rect class="box" x="200" y="12" width="150" height="48" rx="8"/><text class="tm" x="275" y="32.6" text-anchor="middle">kit-step.js</text><text class="s" x="275" y="48.1" text-anchor="middle">подготовка, чтение</text></g><g class="n "><rect class="box" x="370" y="12" width="150" height="48" rx="8"/><text class="tm" x="445" y="32.6" text-anchor="middle">kit-journal.js</text><text class="s" x="445" y="48.1" text-anchor="middle">журнал по блокам</text></g><g class="n "><rect class="box" x="540" y="12" width="150" height="48" rx="8"/><text class="tm" x="615" y="32.6" text-anchor="middle">kit-commit.js</text><text class="s" x="615" y="48.1" text-anchor="middle">коммит и отправка</text></g><g class="n "><rect class="box" x="710" y="12" width="150" height="48" rx="8"/><text class="tm" x="785" y="32.6" text-anchor="middle">secret-scan.js</text><text class="s" x="785" y="48.1" text-anchor="middle">пути и секреты</text></g><g class="n k-ext"><rect class="box" x="880" y="12" width="140" height="48" rx="8"/><text class="tm" x="950" y="32.6" text-anchor="middle">git</text><text class="s" x="950" y="48.1" text-anchor="middle">репозиторий</text></g><line class="life" x1="105" y1="60" x2="105" y2="892"/><line class="life" x1="275" y1="60" x2="275" y2="892"/><line class="life" x1="445" y1="60" x2="445" y2="892"/><line class="life" x1="615" y1="60" x2="615" y2="892"/><line class="life" x1="785" y1="60" x2="785" y2="892"/><line class="life" x1="950" y1="60" x2="950" y2="892"/><path class="e " d="M105 92 L272 92" marker-end="url(#d4-a)"/><text class="lbl " x="190" y="85" text-anchor="middle">kit-step.js &lt;STEP&gt;</text><path class="e " d="M275 116 L947 116" marker-end="url(#d4-a)"/><text class="lbl " x="612.5" y="109" text-anchor="middle">status --porcelain · remote</text><g class="n k-note"><rect class="box" x="191" y="128" width="168" height="40" rx="4"/><text class="s" x="275" y="144.1" text-anchor="middle">файлы шага, входящие</text><text class="s" x="275" y="159.1" text-anchor="middle">строки DECISIONS, режим</text></g><path class="e d" d="M275 192 L108 192" marker-end="url(#d4-a)"/><text class="lbl " x="190" y="185" text-anchor="middle">файлы · решения · режим</text><g class="n k-user"><rect class="box" x="10" y="204" width="190" height="40" rx="4"/><text class="s" x="105" y="220.1" text-anchor="middle">конец этапа? сверка,</text><text class="s" x="105" y="235.1" text-anchor="middle">архив — stage-close.md</text></g><g class="n k-note"><rect class="box" x="10" y="252" width="190" height="40" rx="4"/><text class="s" x="105" y="268.1" text-anchor="middle">блоки: STEP · SUMMARY</text><text class="s" x="105" y="283.1" text-anchor="middle">CHECK · NEXT · DECISIONS</text></g><path class="e " d="M105 318 L442 318" marker-end="url(#d4-a)"/><text class="lbl " x="275" y="311" text-anchor="middle">&lt;&lt;'KIT_BLOCKS' (Bash)</text><g class="n k-note"><rect class="box" x="357" y="330" width="176" height="40" rx="4"/><text class="s" x="445" y="346.1" text-anchor="middle">журнал, части, [x] плана</text><text class="s" x="445" y="361.1" text-anchor="middle">всё или ничего</text></g><path class="e d" d="M445 394 L108 394" marker-end="url(#d4-a)"/><text class="lbl " x="275" y="387" text-anchor="middle">«Сейчас» · изменённые файлы</text><g class="n k-user"><rect class="box" x="10" y="406" width="190" height="40" rx="4"/><text class="s" x="105" y="422.1" text-anchor="middle">просмотр: панель изменений</text><text class="s" x="105" y="437.1" text-anchor="middle">ждём «Коммитить»</text></g><g class="n k-user"><rect class="box" x="10" y="454" width="190" height="40" rx="4"/><text class="s" x="105" y="470.1" text-anchor="middle">конец этапа: перенос —</text><text class="s" x="105" y="485.1" text-anchor="middle">journal-split --stage N</text></g><path class="e " d="M105 526 L612 526" marker-end="url(#d4-a)"/><text class="lbl " x="360" y="519" text-anchor="middle">--inbox N -- &lt;пути&gt; &lt;&lt;'KIT_MSG'</text><path class="e " d="M615 558 L782 558" marker-end="url(#d4-a)"/><text class="lbl " x="700" y="551" text-anchor="middle">--paths &lt;пути&gt;</text><path class="e d u" d="M785 580 L618 580" marker-end="url(#d4-u)"/><text class="lbl u" x="700" y="594" text-anchor="middle">1 → стоп</text><path class="e " d="M615 616 L947 616" marker-end="url(#d4-a)"/><text class="lbl " x="782.5" y="609" text-anchor="middle">add -A -- &lt;пути&gt;</text><path class="e " d="M615 648 L782 648" marker-end="url(#d4-a)"/><text class="lbl " x="700" y="641" text-anchor="middle">--cached &lt;пути&gt;</text><path class="e d u" d="M785 670 L618 670" marker-end="url(#d4-u)"/><text class="lbl u" x="700" y="684" text-anchor="middle">1 → стоп, индекс как есть</text><path class="e " d="M615 706 L947 706" marker-end="url(#d4-a)"/><text class="lbl " x="782.5" y="699" text-anchor="middle">commit -F - -- &lt;пути&gt;</text><g class="n k-note"><rect class="box" x="515" y="718" width="200" height="40" rx="4"/><text class="s" x="615" y="734.1" text-anchor="middle">сверка: 1 коммит, сообщение,</text><text class="s" x="615" y="749.1" text-anchor="middle">статус; --inbox → входящие</text></g><path class="e " d="M615 790 L782 790" marker-end="url(#d4-a)"/><text class="lbl " x="700" y="783" text-anchor="middle">--history — перед первой отправкой</text><path class="e d u" d="M785 812 L618 812" marker-end="url(#d4-u)"/><text class="lbl u" x="700" y="826" text-anchor="middle">1 → не отправлено, код 4</text><path class="e " d="M615 848 L947 848" marker-end="url(#d4-a)"/><text class="lbl " x="782.5" y="841" text-anchor="middle">push -u &lt;имя&gt; HEAD — при --push</text><path class="e d" d="M615 880 L108 880" marker-end="url(#d4-a)"/><text class="lbl " x="360" y="873" text-anchor="middle">код 0 · хеш · отправлено</text></svg>
