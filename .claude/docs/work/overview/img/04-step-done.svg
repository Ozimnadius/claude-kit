<svg class="dg" xmlns="http://www.w3.org/2000/svg" width="1072" height="732" viewBox="-16 -16 1072 732" role="img" aria-label="Последовательность /kit:step-done: Claude собирает файлы шага, docs-keeper обновляет журнал и отчитывается, Claude сверяет отчёт с файлом, git-keeper проверяет пути, добавляет файлы, проверяет секреты и делает один коммит, после чего Claude проверяет, что коммит ровно один и заголовок совпал. Если задан удалённый репозиторий — после проверки коммит отправляется: в первый раз — после проверки всей истории на секреты."><title>Последовательность /kit:step-done: Claude собирает файлы шага, docs-keeper обновляет журнал и отчитывается, Claude сверяет отчёт с файлом, git-keeper проверяет пути, добавляет файлы, проверяет секреты и делает один коммит, после чего Claude проверяет, что коммит ровно один и заголовок совпал. Если задан удалённый репозиторий — после проверки коммит отправляется: в первый раз — после проверки всей истории на секреты.</title><style>svg.dg{--bg:#F1F3F4;--surface:#FFFFFF;--ink:#15191E;--muted:#58616C;--rule:#DDE1E5;--rule-strong:#B6BEC7;--edge:#6A737F;--hook:#B0590C;--hook-bg:#FDF1E3;--skill:#2552CC;--skill-bg:#EBF0FD;--skill-ink:#1C44B0;--agent:#0A7769;--agent-bg:#E2F3EF;--user:#BE2A50;--user-bg:#FCECF0;--code-bg:#ECEFF2;--f-body:'Golos Text','Segoe UI',system-ui,-apple-system,Roboto,sans-serif;--f-mono:'JetBrains Mono','Cascadia Mono',Consolas,'Liberation Mono',monospace;font-family:var(--f-body);font-size:13px;color:var(--ink)}@media (prefers-color-scheme: dark){svg.dg{--bg:#0F1215;--surface:#161A1F;--ink:#E5E8EC;--muted:#99A3AE;--rule:#272D34;--rule-strong:#3B434C;--edge:#8993A0;--hook:#EE9C4C;--hook-bg:#2A1F14;--skill:#86A8FF;--skill-bg:#17213A;--skill-ink:#AAC2FF;--agent:#4FC8B6;--agent-bg:#122724;--user:#FF7D98;--user-bg:#2D1820;--code-bg:#1E2329}}.dg .bgc{fill:var(--surface);stroke:var(--rule)}.dg text{fill:currentColor}.dg .t{font-weight:600;font-size:13.5px}.dg .s{fill:var(--muted);font-size:12px}.dg .m{font-family:var(--f-mono);font-size:11.5px}.dg .tm{font-family:var(--f-mono);font-size:12.5px;font-weight:600}.dg .ag{font-family:var(--f-mono);font-size:11.5px;font-weight:600;fill:var(--agent)}.dg .loop{fill:var(--muted);font-size:12.5px;font-style:italic}.dg .cap{fill:var(--muted);font-size:10.5px;font-weight:600;letter-spacing:.09em;text-transform:uppercase}.dg .box{fill:var(--surface);stroke:var(--rule-strong);stroke-width:1.2}.dg .k-core .box{stroke:var(--ink);stroke-width:1.8}.dg .k-hook .box{fill:var(--hook-bg);stroke:var(--hook)}.dg .k-skill .box{fill:var(--skill-bg);stroke:var(--skill)}.dg .k-skill .tm{fill:var(--skill-ink)}.dg .k-agent .box{fill:var(--agent-bg);stroke:var(--agent)}.dg .k-agent .tm{fill:var(--agent)}.dg .k-user .box{fill:var(--user-bg);stroke:var(--user)}.dg .k-user .t,.dg .k-user .tm{fill:var(--user)}.dg .k-ext .box{fill:none;stroke:var(--muted);stroke-dasharray:5 4}.dg .k-note .box{fill:var(--bg);stroke:var(--rule-strong)}.dg .e{fill:none;stroke:var(--edge);stroke-width:1.4}.dg .e.d{stroke-dasharray:5 4}.dg .e.u{stroke:var(--user)}.dg .ah{fill:var(--edge)}.dg .ah.u{fill:var(--user)}.dg .life{stroke:var(--rule-strong);stroke-width:1.2;stroke-dasharray:3 4}.dg .lbl{font-size:11.5px;fill:var(--muted);paint-order:stroke;stroke:var(--surface);stroke-width:5px;stroke-linejoin:round}.dg .lbl.u{fill:var(--user);font-weight:600}</style><defs><marker id="d4-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah " d="M0,0 L10,5 L0,10 z"/></marker><marker id="d4-u" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="ah u" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect class="bgc" x="-15.5" y="-15.5" width="1071" height="731" rx="10"/><g class="n k-core"><rect class="box" x="25" y="12" width="170" height="48" rx="8"/><text class="t" x="110" y="32.6" text-anchor="middle">Claude</text><text class="s" x="110" y="48.1" text-anchor="middle">основной агент</text></g><g class="n k-agent"><rect class="box" x="245" y="12" width="170" height="48" rx="8"/><text class="tm" x="330" y="32.6" text-anchor="middle">kit:docs-keeper</text><text class="s" x="330" y="48.1" text-anchor="middle">модель sonnet</text></g><g class="n k-agent"><rect class="box" x="465" y="12" width="170" height="48" rx="8"/><text class="tm" x="550" y="32.6" text-anchor="middle">kit:git-keeper</text><text class="s" x="550" y="48.1" text-anchor="middle">модель haiku</text></g><g class="n "><rect class="box" x="685" y="12" width="170" height="48" rx="8"/><text class="tm" x="770" y="32.6" text-anchor="middle">secret-scan.js</text><text class="s" x="770" y="48.1" text-anchor="middle">пути и секреты</text></g><g class="n k-ext"><rect class="box" x="880" y="12" width="140" height="48" rx="8"/><text class="tm" x="950" y="32.6" text-anchor="middle">git</text><text class="s" x="950" y="48.1" text-anchor="middle">репозиторий</text></g><line class="life" x1="110" y1="60" x2="110" y2="692"/><line class="life" x1="330" y1="60" x2="330" y2="692"/><line class="life" x1="550" y1="60" x2="550" y2="692"/><line class="life" x1="770" y1="60" x2="770" y2="692"/><line class="life" x1="950" y1="60" x2="950" y2="692"/><path class="e " d="M110 92 L947 92" marker-end="url(#d4-a)"/><text class="lbl " x="530" y="85" text-anchor="middle">rev-parse HEAD · status --porcelain</text><g class="n k-note"><rect class="box" x="15" y="104" width="190" height="40" rx="4"/><text class="s" x="110" y="120.1" text-anchor="middle">FILES — файлы шага</text><text class="s" x="110" y="135.1" text-anchor="middle">чужие правки → вопрос</text></g><path class="e " d="M110 172 L327 172" marker-end="url(#d4-a)"/><text class="lbl " x="220" y="165" text-anchor="middle">STEP · STATUS · SUMMARY · CHECK · NEXT …</text><g class="n k-note"><rect class="box" x="242" y="184" width="176" height="40" rx="4"/><text class="s" x="330" y="200.1" text-anchor="middle">журнал, план выкладки,</text><text class="s" x="330" y="215.1" text-anchor="middle">RULES → CLAUDE.md</text></g><path class="e d" d="M330 248 L113 248" marker-end="url(#d4-a)"/><text class="lbl " x="220" y="241" text-anchor="middle">отчёт: «Сейчас», цитаты, файлы</text><g class="n k-note"><rect class="box" x="15" y="262" width="190" height="40" rx="4"/><text class="s" x="110" y="278.1" text-anchor="middle">сверка отчёта Grep-ом</text><text class="s" x="110" y="293.1" text-anchor="middle">нет строки → повтор</text></g><g class="n k-user"><rect class="box" x="15" y="310" width="190" height="40" rx="4"/><text class="s" x="110" y="326.1" text-anchor="middle">конец этапа?</text><text class="s" x="110" y="341.1" text-anchor="middle">work/ → archive/ с выбора</text></g><path class="e " d="M110 378 L547 378" marker-end="url(#d4-a)"/><text class="lbl " x="330" y="371" text-anchor="middle">FILES · MESSAGE · BODY · COAUTHOR · KIT_ROOT</text><path class="e " d="M550 410 L767 410" marker-end="url(#d4-a)"/><text class="lbl " x="660" y="403" text-anchor="middle">--paths FILES</text><path class="e d u" d="M770 432 L553 432" marker-end="url(#d4-u)"/><text class="lbl u" x="660" y="446" text-anchor="middle">1 → стоп</text><path class="e " d="M550 468 L947 468" marker-end="url(#d4-a)"/><text class="lbl " x="750" y="461" text-anchor="middle">add -A -- FILES</text><path class="e " d="M550 500 L767 500" marker-end="url(#d4-a)"/><text class="lbl " x="660" y="493" text-anchor="middle">--cached FILES</text><path class="e d u" d="M770 522 L553 522" marker-end="url(#d4-u)"/><text class="lbl u" x="660" y="536" text-anchor="middle">1 → стоп</text><path class="e " d="M550 558 L947 558" marker-end="url(#d4-a)"/><text class="lbl " x="750" y="551" text-anchor="middle">commit -m '…' -- FILES</text><path class="e d" d="M550 590 L113 590" marker-end="url(#d4-a)"/><text class="lbl " x="330" y="583" text-anchor="middle">хеш · файлы · подпись</text><path class="e " d="M110 620 L947 620" marker-end="url(#d4-a)"/><text class="lbl " x="530" y="613" text-anchor="middle">проверка: 1 коммит, заголовок = MESSAGE, подпись</text><path class="e " d="M110 652 L767 652" marker-end="url(#d4-a)"/><text class="lbl " x="440" y="645" text-anchor="middle">--history — только перед первой отправкой</text><path class="e " d="M110 684 L947 684" marker-end="url(#d4-a)"/><text class="lbl " x="530" y="677" text-anchor="middle">push -u &lt;имя&gt; HEAD — если задан «Удалённый репозиторий»</text></svg>
